media:
  input: src/images
  output: /images
content:
  - name: site
    label: Page settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: title
        label: Browser tab title
        type: string
      - name: description
        label: Search-engine description
        type: text
      - name: formspreeEndpoint
        label: Contact form address (Formspree)
        type: string
  - name: header
    label: Header / logo
    type: file
    path: src/content/header.json
    format: json
    fields:
      - name: logoImage
        label: Logo image (optional — overrides the icon below if set)
        type: image
      - name: logoIcon
        label: Logo icon (used only if no logo image is set)
        type: select
        options:
          values:
            - leaf
            - heart
            - star
            - award
            - shield
            - sun
            - moon
            - feather
            - compass
            - home
            - anchor
            - activity
            - layers
            - zap
            - globe
      - name: logoLine1
        label: Logo — first line
        type: string
      - name: logoLine2
        label: Logo — second line
        type: string
  - name: theme
    label: Colours / theme
    type: file
    path: src/content/theme.json
    format: json
    fields:
      - name: palette
        label: Colour scheme
        type: select
        options:
          values:
            - value: navy
              label: Navy & blue
            - value: forest
              label: Forest green
            - value: terracotta
              label: Terracotta & clay
            - value: plum
              label: Plum & heather
            - value: charcoal
              label: Charcoal & gold
      - name: customDark
        label: 'Advanced — main dark colour (hex, leave blank to use the scheme above, e.g. #1c3553)'
        type: string
      - name: customAccent
        label: Advanced — accent colour (hex, optional)
        type: string
      - name: customLight
        label: Advanced — light background colour (hex, optional)
        type: string
      - name: customCream
        label: Advanced — soft tint colour (hex, optional)
        type: string
  - name: menu
    label: Main menu
    type: file
    path: src/content/menu.json
    format: json
    fields:
      - name: items
        label: Links
        description: Drag the rows to change the order links appear in. Untick "Show in menu" to hide one without deleting
          it — the page itself stays online, it just isn't linked. Link names and their destinations are fixed and can't be
          edited here.
        type: object
        list: true
        fields:
          - name: item
            label: Menu link
            type: select
            options:
              values:
                - value: about
                  label: About
                - value: services
                  label: Services
                - value: approach
                  label: My Approach
                - value: wellbeing
                  label: Wellbeing
                - value: counselling
                  label: Counselling
                - value: training-coaching
                  label: Training & Coaching
                - value: podcast
                  label: Podcast
                - value: merchandise
                  label: Merchandise
                - value: meet-the-team
                  label: Meet the Team
                - value: contact
                  label: Contact
          - name: visible
            label: Show in menu
            type: boolean
  - name: hero
    label: Top section (hero)
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading above title
        type: string
      - name: headingLead
        label: Main heading — first line
        type: string
      - name: headingEmphasis
        label: Main heading — italic second line
        type: string
      - name: paragraph1
        label: Intro paragraph 1
        type: text
      - name: paragraph2
        label: Intro paragraph 2
        type: text
      - name: primaryButton
        label: Main button text
        type: string
      - name: secondaryButton
        label: Secondary button text
        type: string
      - name: image
        label: Hero photo
        type: image
  - name: about
    label: About Kelly
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: headingLead
        label: Heading — first part
        type: string
      - name: headingEmphasis
        label: Heading — italic part
        type: string
      - name: paragraph1
        label: Paragraph 1
        type: text
      - name: paragraph2
        label: Paragraph 2
        type: text
      - name: paragraph3
        label: Paragraph 3
        type: text
      - name: image
        label: About photo
        type: image
      - name: badges
        label: Credential badges
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - award
                - map-pin
                - clock
                - shield
                - heart
                - star
                - check
                - check-circle
                - user
                - users
                - brain
                - layers
                - leaf
                - feather
                - sun
                - moon
                - briefcase
                - monitor
                - book
                - clipboard
                - calendar
                - mail
                - phone
                - message-circle
                - globe
                - home
                - activity
                - compass
                - coffee
                - headphones
                - tag
                - target
                - thumbs-up
                - trending-up
                - zap
          - name: label
            label: Text
            type: string
  - name: services
    label: Services section
    type: file
    path: src/content/services.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Section heading
        type: string
      - name: intro
        label: Intro text
        type: text
      - name: cards
        label: Service cards
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - award
                - map-pin
                - clock
                - shield
                - heart
                - star
                - check
                - check-circle
                - user
                - users
                - brain
                - layers
                - leaf
                - feather
                - sun
                - moon
                - briefcase
                - monitor
                - book
                - clipboard
                - calendar
                - mail
                - phone
                - message-circle
                - globe
                - home
                - activity
                - compass
                - coffee
                - headphones
                - tag
                - target
                - thumbs-up
                - trending-up
                - zap
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text
          - name: meta
            label: Footer line (duration / format)
            type: string
  - name: workplace
    label: Workplace Wellness section
    type: file
    path: src/content/workplace.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading above title (optional)
        type: string
      - name: heading
        label: Section heading
        type: string
      - name: body
        label: Body text (press Enter for new lines)
        type: text
      - name: image
        label: Image (optional — leave empty for full-width text)
        type: image
      - name: imageSide
        label: Which side should the image go?
        type: select
        options:
          values:
            - left
            - right
      - name: cards
        label: Cards (optional — leave empty for text only)
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - award
                - map-pin
                - clock
                - shield
                - heart
                - star
                - check
                - check-circle
