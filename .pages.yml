  - name: process
    label: The process (3 steps)
    type: file
    path: src/content/process.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: heading
        label: Section heading
        type: string
      - name: intro
        label: Intro text
        type: text
      - name: steps
        label: Steps
        type: object
        list: true
        fields:
          - name: title
            label: Step title
            type: string
          - name: description
            label: Step description
            type: text
  - name: contact
    label: Contact section
    type: file
    path: src/content/contact.json
    format: json
    fields:
