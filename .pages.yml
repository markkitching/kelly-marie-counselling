media:
  input: src/images
  output: /images

content:
  - name: content
    label: Website content
    type: file
    path: src/_data/content.json
    format: json
    fields:
      - name: site
        label: Page settings
        type: object
        fields:
          - { name: title, label: Browser tab title, type: string }
          - { name: description, label: Search-engine description, type: text }
          - { name: formspreeEndpoint, label: Contact form address (Formspree), type: string }

      - name: header
        label: Header / logo
        type: object
        fields:
          - name: logoIcon
            label: Logo icon
            type: select
            options:
              values: [leaf, heart, star, award, shield, sun, moon, feather, compass, home, anchor, activity, layers, zap, globe]
          - { name: logoLine1, label: Logo — first line, type: string }
          - { name: logoLine2, label: Logo — second line, type: string }

      - name: theme
        label: Colours / theme
        type: object
        fields:
          - name: palette
            label: Colour scheme
            type: select
            options:
              values:
                - { value: navy, label: "Navy & blue" }
                - { value: forest, label: "Forest green" }
                - { value: terracotta, label: "Terracotta & clay" }
                - { value: plum, label: "Plum & heather" }
                - { value: charcoal, label: "Charcoal & gold" }
          - { name: customDark, label: "Advanced — main dark colour (hex, leave blank to use the scheme above, e.g. #1c3553)", type: string }
          - { name: customAccent, label: "Advanced — accent colour (hex, optional)", type: string }
          - { name: customLight, label: "Advanced — light background colour (hex, optional)", type: string }
          - { name: customCream, label: "Advanced — soft tint colour (hex, optional)", type: string }

      - name: nav
        label: Navigation links (drag to reorder)
        type: object
        list: true
        fields:
          - { name: label, label: Link text, type: string }
          - { name: anchor, label: "Links to section (type a section name, e.g. about, services, or a custom section's short name)", type: string }

      - name: sections
        label: Sections (drag to reorder — built-in and custom together)
        type: block
        list: true
        blockKey: type
        blocks:
          - { name: about,    label: "About Kelly (built-in)" }
          - { name: services, label: "Services (built-in)" }
          - { name: approach, label: "Therapeutic Approach (built-in)" }
          - { name: process,  label: "The Process (built-in)" }
          - { name: contact,  label: "Contact (built-in)" }
          - name: text
            label: "Custom — text block"
            fields:
              - { name: id, label: "Page anchor / short name (e.g. fees, faq)", type: string }
              - name: background
                label: Background colour
                type: select
                options:
                  values: [white, stone, forest]
              - { name: eyebrow, label: Small heading, type: string }
              - { name: heading, label: Section heading, type: string }
              - { name: intro, label: Intro text, type: text }
              - { name: body, label: "Body text (press Enter for new lines)", type: text }
          - name: cards
            label: "Custom — icon cards"
            fields:
              - { name: id, label: "Page anchor / short name (e.g. fees, faq)", type: string }
              - name: background
                label: Background colour
                type: select
                options:
                  values: [white, stone, forest]
              - { name: eyebrow, label: Small heading, type: string }
              - { name: heading, label: Section heading, type: string }
              - { name: intro, label: Intro text, type: text }
              - name: cards
                label: Cards
                type: object
                list: true
                fields:
                  - name: icon
                    label: Icon
                    type: select
                    options:
                      values: [award, map-pin, clock, shield, heart, star, check, check-circle, user, users, brain, layers, leaf, feather, sun, moon, briefcase, monitor, book, clipboard, calendar, mail, phone, message-circle, globe, home, activity, compass, coffee, headphones, tag, target, thumbs-up, trending-up, zap]
                  - { name: title, label: Title, type: string }
                  - { name: description, label: Description, type: text }
                  - { name: meta, label: Small footer line (optional), type: string }
          - name: quote
            label: "Custom — quote banner"
            fields:
              - { name: id, label: "Page anchor / short name (e.g. fees, faq)", type: string }
              - name: background
                label: Background colour
                type: select
                options:
                  values: [white, stone, forest]
              - { name: heading, label: Section heading (optional), type: string }
              - { name: quote, label: Quote text, type: text }
              - { name: quoteAuthor, label: Quote author, type: string }

      - name: hero
        label: Top section (hero)
        type: object
        fields:
          - { name: eyebrow, label: Small heading above title, type: string }
          - { name: headingLead, label: Main heading — first line, type: string }
          - { name: headingEmphasis, label: Main heading — italic second line, type: string }
          - { name: paragraph1, label: Intro paragraph 1, type: text }
          - { name: paragraph2, label: Intro paragraph 2, type: text }
          - { name: primaryButton, label: Main button text, type: string }
          - { name: secondaryButton, label: Secondary button text, type: string }
          - { name: image, label: Hero photo, type: image }

      - name: about
        label: About Kelly
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: headingLead, label: Heading — first part, type: string }
          - { name: headingEmphasis, label: Heading — italic part, type: string }
          - { name: paragraph1, label: Paragraph 1, type: text }
          - { name: paragraph2, label: Paragraph 2, type: text }
          - { name: paragraph3, label: Paragraph 3, type: text }
          - { name: image, label: About photo, type: image }
          - name: badges
            label: Credential badges
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [award, map-pin, clock, shield, heart, star, check, check-circle, user, users, brain, layers, leaf, feather, sun, moon, briefcase, monitor, book, clipboard, calendar, mail, phone, message-circle, globe, home, activity, compass, coffee, headphones, tag, target, thumbs-up, trending-up, zap]
              - { name: label, label: Text, type: string }

      - name: services
        label: Services section
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: cards
            label: Service cards
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [award, map-pin, clock, shield, heart, star, check, check-circle, user, users, brain, layers, leaf, feather, sun, moon, briefcase, monitor, book, clipboard, calendar, mail, phone, message-circle, globe, home, activity, compass, coffee, headphones, tag, target, thumbs-up, trending-up, zap]
              - { name: title, label: Title, type: string }
              - { name: description, label: Description, type: text }
              - { name: meta, label: Footer line (duration / format), type: string }

      - name: approach
        label: Therapeutic approach
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Approach cards
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [award, map-pin, clock, shield, heart, star, check, check-circle, user, users, brain, layers, leaf, feather, sun, moon, briefcase, monitor, book, clipboard, calendar, mail, phone, message-circle, globe, home, activity, compass, coffee, headphones, tag, target, thumbs-up, trending-up, zap]
              - { name: title, label: Title, type: string }
              - { name: description, label: Description, type: text }
          - { name: quote, label: Closing quote, type: text }
          - { name: quoteAuthor, label: Quote author, type: string }

      - name: process
        label: The process (3 steps)
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step title, type: string }
              - { name: description, label: Step description, type: text }

      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - { name: email, label: Email address, type: string }
          - { name: locationLine1, label: Location — line 1, type: string }
          - { name: locationLine2, label: Location — line 2, type: string }
          - { name: availability, label: Availability message, type: text }
          - { name: confidentialityTitle, label: Confidentiality box — title, type: string }
          - { name: confidentialityText, label: Confidentiality box — text, type: text }

      - name: footer
        label: Footer
        type: object
        fields:
          - { name: tagline, label: Tagline, type: text }
          - { name: bacpNumber, label: BACP membership number, type: string }
