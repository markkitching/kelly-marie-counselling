media:
  input: src/images
  output: /images

content:
  - name: content
    label: Website content
    type: file
    path: src/_data/content.json
    format: json
    fields:
      - name: site
        label: Page settings
        type: object
        fields:
          - { name: title, label: Browser tab title, type: string }
          - { name: description, label: Search-engine description, type: text }
          - { name: formspreeEndpoint, label: Contact form address (Formspree), type: string }

      - name: hero
        label: Top section (hero)
        type: object
        fields:
          - { name: eyebrow, label: Small heading above title, type: string }
          - { name: headingLead, label: Main heading — first line, type: string }
          - { name: headingEmphasis, label: Main heading — italic second line, type: string }
          - { name: paragraph1, label: Intro paragraph 1, type: text }
          - { name: paragraph2, label: Intro paragraph 2, type: text }
          - { name: primaryButton, label: Main button text, type: string }
          - { name: secondaryButton, label: Secondary button text, type: string }
          - { name: image, label: Hero photo, type: image }

      - name: about
        label: About Kelly
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: headingLead, label: Heading — first part, type: string }
          - { name: headingEmphasis, label: Heading — italic part, type: string }
          - { name: paragraph1, label: Paragraph 1, type: text }
          - { name: paragraph2, label: Paragraph 2, type: text }
          - { name: paragraph3, label: Paragraph 3, type: text }
          - { name: image, label: About photo, type: image }
          - name: badges
            label: Credential badges
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [award, map-pin, clock, shield, heart, star, check]
              - { name: label, label: Text, type: string }

      - name: services
        label: Services section
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: cards
            label: Service cards
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [user, heart, sun, briefcase, users, monitor, shield, brain, layers]
              - { name: title, label: Title, type: string }
              - { name: description, label: Description, type: text }
              - { name: meta, label: Footer line (duration / format), type: string }

      - name: approach
        label: Therapeutic approach
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Approach cards
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [brain, layers, shield, heart, leaf, user]
              - { name: title, label: Title, type: string }
              - { name: description, label: Description, type: text }
          - { name: quote, label: Closing quote, type: text }
          - { name: quoteAuthor, label: Quote author, type: string }

      - name: process
        label: The process (3 steps)
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step title, type: string }
              - { name: description, label: Step description, type: text }

      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - { name: email, label: Email address, type: string }
          - { name: locationLine1, label: Location — line 1, type: string }
          - { name: locationLine2, label: Location — line 2, type: string }
          - { name: availability, label: Availability message, type: text }
          - { name: confidentialityTitle, label: Confidentiality box — title, type: string }
          - { name: confidentialityText, label: Confidentiality box — text, type: text }

      - name: footer
        label: Footer
        type: object
        fields:
          - { name: tagline, label: Tagline, type: text }
          - { name: bacpNumber, label: BACP membership number, type: string }
