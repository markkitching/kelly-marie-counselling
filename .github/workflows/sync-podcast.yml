name: Sync podcast episodes

# Runs daily, and on demand from the Actions tab. Each run pulls the channel's recent
# episodes into src/content/pages/podcast.json and commits only if something actually
# changed — which then triggers the usual Cloudflare deploy.
#
# Needs no configuration. The channel handle is committed in the sync script and the
# UC… id is looked up from it; a channel id isn't secret, so nothing lives in repository
# settings. To point it at a different channel, set the YOUTUBE_CHANNEL variable.
#
# The default source is the channel's public Atom feed, which needs no credentials but
# carries only the 15 most recent videos. For the full back catalogue, add a
# YOUTUBE_API_KEY secret and set the EPISODE_SOURCE variable to youtube-api.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  # Saving the podcast page in the CMS pushes a commit; this picks it straight up, so a
  # deleted episode lands in the archive within a minute rather than at 06:00 tomorrow.
  # The job's own commits use GITHUB_TOKEN, which by design does not re-trigger this.
  push:
    branches: [main]
    paths:
      - "src/content/pages/podcast.json"

permissions:
  contents: write

# Never let two syncs race each other onto main.
concurrency:
  group: sync-podcast
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the merge rules still hold
        run: node scripts/test-sync-merge.js

      - name: Pull episodes
        env:
          EPISODE_SOURCE: ${{ vars.EPISODE_SOURCE || 'youtube-rss' }}
          YOUTUBE_CHANNEL: ${{ vars.YOUTUBE_CHANNEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EPISODE_SYNC_LIMIT: ${{ vars.EPISODE_SYNC_LIMIT || '30' }}
        run: node scripts/sync-podcast-episodes.js

      - name: Confirm the site still builds
        run: |
          npm ci
          npm run build

      - name: Commit if anything changed
        run: |
          # The ledger must be committed alongside the page. Left out, it never records
          # the episodes the sync pulls in, so deleting one of those later looks like an
          # episode that has never been seen — and it gets pulled straight back.
          FILES="src/content/pages/podcast.json scripts/podcast-ledger.json"
          if git diff --quiet -- $FILES; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Sync podcast episodes"
          git push
