name: Sync podcast episodes

# Runs daily, and on demand from the Actions tab. Each run pulls the channel's recent
# episodes into src/content/pages/podcast.json and commits only if something actually
# changed — which then triggers the usual Cloudflare deploy.
#
# Needs one repository variable:
#   YOUTUBE_CHANNEL_ID   the UC… id from YouTube Studio > Settings > Channel > Advanced
#
# The default source is the channel's public Atom feed, which needs no credentials but
# carries only the 15 most recent videos. For the full back catalogue, add a
# YOUTUBE_API_KEY secret and set EPISODE_SOURCE to youtube-api below.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily

permissions:
  contents: write

# Never let two syncs race each other onto main.
concurrency:
  group: sync-podcast
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the merge rules still hold
        run: node scripts/test-sync-merge.js

      - name: Pull episodes
        env:
          EPISODE_SOURCE: ${{ vars.EPISODE_SOURCE || 'youtube-rss' }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EPISODE_SYNC_LIMIT: ${{ vars.EPISODE_SYNC_LIMIT || '30' }}
        run: node scripts/sync-podcast-episodes.js

      - name: Confirm the site still builds
        run: |
          npm ci
          npm run build

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/content/pages/podcast.json; then
            echo "No new episodes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/pages/podcast.json
          git commit -m "Sync podcast episodes from Spotify"
          git push
